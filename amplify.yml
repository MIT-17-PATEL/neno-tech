version: 1
applications:
  - appRoot: source
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || nvm use 22 || true
            - node -v
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - env | grep -e NEXT_PUBLIC_ -e DATABASE_URL -e ODOO_ -e CONTACT_EXCEL_ -e MICROSOFT_EXCEL_ >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: source/.next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .npm/**/*
          - node_modules/**/*
