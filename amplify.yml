version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm use 22 || true
        - node -v
        - cd source && (npm ci --cache .npm --prefer-offline || npm install --legacy-peer-deps)
    build:
      commands:
        - cd source && (env | grep -e NEXT_PUBLIC_ -e DATABASE_URL -e ODOO_ -e CONTACT_EXCEL_ -e MICROSOFT_EXCEL_ >> .env.production || true)
        - cd source && npm run build
  artifacts:
    baseDirectory: source/.next
    files:
      - '**/*'
  cache:
    paths:
      - source/.next/cache/**/*
      - source/.npm/**/*
      - source/node_modules/**/*
